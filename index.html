<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Tinder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button id="gallery-btn" class="header-btn"><i class="fas fa-heart"></i> My Likes</button>
            <h1 class="app-title">Cat Tinder</h1>
            <div class="offline-indicator" id="offline-indicator">Offline</div>
        </header>

        <main>
            <div class="card-container">
                <div class="card">
                    <div class="loader"></div>
                    <img src="" alt="A cute cat" id="cat-photo">
                </div>
            </div>

            <div class="actions">
                <button id="dislike-btn" class="action-btn dislike"><i class="fas fa-times"></i></button>
                <button id="superlike-btn" class="action-btn superlike"><i class="fas fa-star"></i></button>
                <button id="like-btn" class="action-btn like"><i class="fas fa-heart"></i></button>
            </div>
        </main>

        <div id="liked-gallery-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>My Liked Cats</h2>
                <div id="liked-cats-container" class="gallery-grid">
                    <!-- Liked cats will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
